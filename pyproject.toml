[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy2api"
version = "1.0.0"
description = "把 WorkBuddy / CodeBuddy 账号变成 OpenAI 兼容 API 的多账号网关（纯标准库）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "workbuddy2api contributors" }]
keywords = ["workbuddy", "codebuddy", "openai", "gateway", "reverse-proxy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Internet :: Proxy Servers",
]
dependencies = []

[project.scripts]
workbuddy2api = "wb2api.__main__:main"
wb2a = "wb2api.__main__:main"

[project.urls]
Homepage = "https://github.com/ardeyouxipianyi/workbuddy2api-hub"

[tool.setuptools]
packages = ["wb2api", "wb2api.adapters", "wb2api.web"]

[tool.setuptools.package-data]
"wb2api.web" = ["static/*"]
