name: ci

# 只在动到代码/测试/打包的地方跑；改 README 不必等五分钟。
on:
  push:
    branches: [main]
    paths:
      - "wb2api/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 零依赖：不装 requirements，直接跑。装了反而掩盖"其实依赖了某个包"。
      - name: Byte-compile
        run: python -m compileall -q wb2api

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      # 配置项最容易腐烂：键名写错了不会报错，用户改了配置等于没改。
      - name: Config keys are all read somewhere
        run: python tools/audit_config.py

      # 配置样例是由代码生成的，手改会和默认值分叉。这里保证它没分叉。
      - name: Example config is in sync
        shell: bash
        run: |
          python tools/gen_example_config.py >/dev/null
          git diff --exit-code -- config.example.json

  package:
    name: build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build
          python -m build --wheel
      - name: Check the wheel carries the panel assets
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["wb2api/web/static/app.js", "wb2api/web/static/index.html", "wb2api/web/static/style.css"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit("wheel 缺静态资源: %s" % missing)
          print("wheel ok:", wheel, len(names), "entries")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  install:
    name: install smoke
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      # 装完真的起一次服务：能起、能回健康检查，才算"装得上"。
      - name: Install and probe
        run: |
          python -m pip install --quiet dist/*.whl
          WB_DATA_DIR="$RUNNER_TEMP/data" wb2a serve --port 18790 --no-scheduler &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18790/healthz >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18790/healthz
          wb2a version
